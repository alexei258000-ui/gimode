<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зарплата 2/2</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding:30px 15px;margin:0}
  .card{background:#fff;border-radius:16px;padding:25px;max-width:420px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1)}
  h1{font-size:21px;text-align:center;margin-top:0}
  label{display:block;margin:15px 0 5px;font-weight:bold;font-size:14px}
  input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
  button{width:100%;margin-top:20px;padding:15px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:bold}
  .result{margin-top:20px;padding:15px;background:#e8f5e9;border-radius:8px;font-size:15px;line-height:1.7;display:none}
  .result b{color:#2e7d32;font-size:19px}
</style>
</head>
<body>
<div class="card">
  <h1>💰 Зарплата 2/2</h1>
  <label>Оплата за смену (₽)</label>
  <input type="number" id="rate" value="4000" min="0">
  <label>Месяц</label>
  <select id="month">
    <option value="31">31 день</option>
    <option value="30">30 дней</option>
    <option value="28">28 дней (февраль)</option>
    <option value="29">29 дней (високосный)</option>
  </select>
  <label>С какой смены начинается месяц?</label>
  <select id="start">
    <option value="1">С рабочей (1-я)</option>
    <option value="0">С выходной (2-я)</option>
  </select>
  <button onclick="calc()">Рассчитать</button>
  <div class="result" id="res"></div>
</div>
<script>
function calc(){
  var rate=+document.getElementById('rate').value;
  var days=+document.getElementById('month').value;
  var startWork=+document.getElementById('start').value;
  var work=0;
  for(var d=0;d<days;d++){
    var c=d%4;
    var isWork=startWork?(c<2):(c>=2);
    if(isWork)work++;
  }
  var total=work*rate;
  var r=document.getElementById('res');
  r.style.display='block';
  r.innerHTML='Рабочих смен: <b>'+work+'</b><br>'+
    'Оплата за смену: '+rate.toLocaleString('ru-RU')+' ₽<br>'+
    'Зарплата за месяц: <b>'+total.toLocaleString('ru-RU')+' ₽</b>';
}
</script>
</body>
</html>
